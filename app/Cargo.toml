[package]
name = "bulk-yt"
version = "0.1.0"
edition = "2021"
# Cargo package metadata. Set the GitHub description and topics separately in the repository’s About settings.
description = "Batch Audio is a desktop app that downloads audio from multiple YouTube links and saves it as MP3, WAV, M4A, FLAC, Opus, or AAC."
keywords = ["youtube", "audio-downloader", "batch-download", "yt-dlp", "egui"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
png = "0.17"
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
